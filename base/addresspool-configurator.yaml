apiVersion: v1
kind: ServiceAccount
metadata:
  name: address-pool-configurator
  # Namespace deste objeto; não confundir com seleção de namespaces de origem.
  # Namespace deste objeto; não confundir com seleção de namespaces de origem.
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: address-pool-configurator
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups:
      - metallb.io
    # Recursos ou dependências desta seção; avaliar seu escopo antes de alterar.
    # Recursos ou dependências desta seção; avaliar seu escopo antes de alterar.
    resources:
      - ipaddresspools
    resourceNames:
      - lb-pool
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: address-pool-configurator
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
# Identidades que recebem as permissões declaradas pelo papel referenciado.
# Identidades que recebem as permissões declaradas pelo papel referenciado.
subjects:
  - kind: ServiceAccount
    name: address-pool-configurator
    namespace: metallb-system
# Referência de permissão; este vínculo não cria identidades no provedor.
# Referência de permissão; este vínculo não cria identidades no provedor.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: address-pool-configurator
---
apiVersion: batch/v1
kind: Job
metadata:
  name: address-pool-configurator
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: address-pool-configurator
      restartPolicy: OnFailure
      containers:
        - name: configure
          image: registry.access.redhat.com/ubi9/ubi-minimal:9.6
          imagePullPolicy: IfNotPresent
          env:
            - name: POOL_ADDRESSES
              valueFrom:
                configMapKeyRef:
                  name: metallb-pool-input
                  key: addresses
            - name: POOL_CONFIRMED
              valueFrom:
                configMapKeyRef:
                  name: metallb-pool-input
                  key: confirmed
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /bin/sh
            - -ec
          args:
            - |
              # A configuração deve ser provisionada por ambiente fora do Git público.
              [ "$POOL_CONFIRMED" = true ] || { echo "Faixa não confirmada no IPAM/DHCP" >&2; exit 1; }
              # Aceita uma faixa IPv4, sem espaços ou caracteres de injeção JSON.
              case "$POOL_ADDRESSES" in
                ''|*[!0-9.-]*) echo "Formato de faixa inválido" >&2; exit 1 ;;
              esac
              # Usar apenas builtins POSIX: a imagem mínima não exige awk ou Python.
              case "$POOL_ADDRESSES" in *-*) ;; *) exit 1 ;; esac
              FIRST="${POOL_ADDRESSES%%-*}"
              LAST="${POOL_ADDRESSES#*-}"
              case "$LAST" in *-*) exit 1 ;; esac
              FIRST_NUMBER=0
              LAST_NUMBER=0
              SIDE=first
              set -f
              for ADDRESS in "$FIRST" "$LAST"; do
                PREVIOUS_IFS="$IFS"
                IFS=.
                set -- $ADDRESS
                IFS="$PREVIOUS_IFS"
                [ "$#" -eq 4 ] || exit 1
                NUMBER=0
                for OCTET in "$@"; do
                  [ -n "$OCTET" ] && [ "${#OCTET}" -le 3 ] || exit 1
                  OCTET="${OCTET#0}"
                  OCTET="${OCTET#0}"
                  OCTET="${OCTET:-0}"
                  [ "$OCTET" -le 255 ] || exit 1
                  NUMBER=$((NUMBER * 256 + OCTET))
                done
                if [ "$SIDE" = first ]; then FIRST_NUMBER="$NUMBER"; else LAST_NUMBER="$NUMBER"; fi
                SIDE=last
              done
              [ "$FIRST_NUMBER" -le "$LAST_NUMBER" ] || exit 1
              ADDRESSES="$POOL_ADDRESSES"
              API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}"
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

              curl --fail --silent --show-error \
                --cacert "$CACERT" \
                --header "Authorization: Bearer $TOKEN" \
                --header "Content-Type: application/merge-patch+json" \
                --request PATCH \
                --data "{\"spec\":{\"addresses\":[\"$ADDRESSES\"]}}" \
                "$API/apis/metallb.io/v1beta1/namespaces/$POD_NAMESPACE/ipaddresspools/lb-pool"

              echo
              echo "Configured MetalLB address pool: $ADDRESSES"
          # Restringe privilégios do processo; conferir compatibilidade com a SCC.
          # Restringe privilégios do processo; conferir compatibilidade com a SCC.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
